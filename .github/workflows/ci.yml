name: CI

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 代码检查
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint check
        run: |
          # 检查 package.json 语法
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          echo "✓ package.json 语法正确"
          
          # 检查 main.js 语法
          node --check main.js
          echo "✓ main.js 语法正确"
          
          # 检查 renderer.js 语法
          node --check renderer.js
          echo "✓ renderer.js 语法正确"
          
          echo "✅ 所有代码语法检查通过"

  # 构建测试
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build check
        run: |
          # 验证项目结构
          test -f main.js || (echo "❌ main.js 不存在" && exit 1)
          test -f renderer.js || (echo "❌ renderer.js 不存在" && exit 1)
          test -f index.html || (echo "❌ index.html 不存在" && exit 1)
          test -f package.json || (echo "❌ package.json 不存在" && exit 1)
          echo "✅ 项目结构完整"
      
      - name: Dependency audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  # Electron 打包测试 (仅 main/master 分支)
  package:
    runs-on: ${{ matrix.os }}
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Electron Builder
        run: npm install --save-dev electron-builder
      
      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布 (打 tag 时触发)
  release:
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Electron Builder
        run: npm install --save-dev electron-builder
      
      - name: Build and Release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
