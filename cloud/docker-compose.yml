version: '3.8'

services:
  chenyi-cloud:
    build: .
    container_name: chenyi-cloud
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-chenyi-secret-key-2024}
      - DATABASE_URL=postgresql://chenyi:chenyi123@postgres:5432/chenyi
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: chenyi-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=chenyi
      - POSTGRES_PASSWORD=chenyi123
      - POSTGRES_DB=chenyi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: chenyi-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
