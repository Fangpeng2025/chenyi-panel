<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨翼Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #252542;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --border: #2a2a4a;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* 标题栏 */
    .titlebar {
      height: 32px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border);
    }
    
    .titlebar-title {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .titlebar-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    
    .titlebar-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }
    
    .titlebar-btn.close { background: #ff5f57; }
    .titlebar-btn.minimize { background: #ffbd2e; }
    .titlebar-btn.maximize { background: #28c840; }
    
    /* 主布局 */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    /* 侧边栏 */
    .sidebar {
      width: 60px;
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      border-right: 1px solid var(--border);
    }
    
    .nav-item {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    
    .nav-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    
    .nav-item.active {
      background: var(--accent);
      color: white;
    }
    
    /* 内容区 */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* 面板 */
    .panel {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }
    
    .panel.active { display: flex; }
    
    /* 首页 */
    .home-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .home-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      background: var(--bg-tertiary);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
    }
    
    .status-dot.online { background: var(--success); }
    
    /* 设备列表 */
    .device-list {
      padding: 20px;
      overflow-y: auto;
    }
    
    .device-card {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    
    .device-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .device-icon {
      width: 40px;
      height: 40px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .device-info h3 {
      font-size: 14px;
      margin-bottom: 2px;
    }
    
    .device-info p {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .device-actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    
    .btn-primary:hover { background: var(--accent-hover); }
    
    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    
    .btn-secondary:hover { background: var(--border); }
    
    /* AI对话 */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .message {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
    }
    
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .message-content {
      flex: 1;
      background: var(--bg-secondary);
      padding: 12px 16px;
      border-radius: 12px;
      border-top-left-radius: 4px;
    }
    
    .message.user .message-content {
      background: var(--accent);
    }
    
    .chat-input-container {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }
    
    .chat-input {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
    }
    
    .chat-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    /* 登录页 */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-box {
      background: var(--bg-secondary);
      padding: 40px;
      border-radius: 16px;
      width: 360px;
      border: 1px solid var(--border);
    }
    
    .login-box h2 {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .form-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- 标题栏 -->
  <div class="titlebar">
    <span class="titlebar-title">晨翼Agent</span>
    <div class="titlebar-controls">
      <button class="titlebar-btn minimize" onclick="minimizeWindow()"></button>
      <button class="titlebar-btn maximize" onclick="maximizeWindow()"></button>
      <button class="titlebar-btn close" onclick="closeWindow()"></button>
    </div>
  </div>

  <!-- 登录页 -->
  <div id="login-page" class="login-container">
    <div class="login-box">
      <h2>🦐 晨翼Agent</h2>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="login-email" class="form-input" placeholder="请输入邮箱">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" class="form-input" placeholder="请输入密码">
      </div>
      <button class="btn btn-primary login-btn" onclick="handleLogin()">登录</button>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-page" class="main-container" style="display: none;">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="nav-item active" data-panel="home" onclick="switchPanel('home')">🏠</div>
      <div class="nav-item" data-panel="devices" onclick="switchPanel('devices')">📱</div>
      <div class="nav-item" data-panel="chat" onclick="switchPanel('chat')">💬</div>
      <div class="nav-item" data-panel="settings" onclick="switchPanel('settings')">⚙️</div>
    </div>

    <!-- 内容区 -->
    <div class="content">
      <!-- 首页 -->
      <div id="panel-home" class="panel active">
        <div class="home-header">
          <h1>欢迎回来</h1>
          <div class="status-badge">
            <span class="status-dot" id="connection-dot"></span>
            <span id="connection-text">未连接</span>
          </div>
        </div>
        <div class="device-list" id="device-list">
          <!-- 设备列表动态生成 -->
        </div>
      </div>

      <!-- 设备管理 -->
      <div id="panel-devices" class="panel">
        <div class="home-header">
          <h1>设备管理</h1>
        </div>
        <div class="device-list" id="all-devices">
          <!-- 所有设备 -->
        </div>
      </div>

      <!-- AI对话 -->
      <div id="panel-chat" class="panel">
        <div class="chat-container">
          <div class="chat-messages" id="chat-messages">
            <!-- 消息列表 -->
          </div>
          <div class="chat-input-container">
            <textarea class="chat-input" id="chat-input" placeholder="输入消息..." rows="1"></textarea>
            <button class="btn btn-primary" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>

      <!-- 设置 -->
      <div id="panel-settings" class="panel">
        <div class="home-header">
          <h1>设置</h1>
        </div>
        <div style="padding: 20px;">
          <p style="color: var(--text-secondary);">设置功能开发中...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
