<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨翼Agent UI 组件演示</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #1d1d1f;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --accent: #007aff;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    
    .demo-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    .demo-header {
      height: 60px;
      background: rgba(30, 30, 32, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
    }
    
    .demo-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .demo-card {
      background: rgba(30, 30, 32, 0.9);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }
    
    .demo-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .demo-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 40px;
    }
    
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .feature-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .feature-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    
    .feature-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    
    .feature-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .feature-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .demo-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .demo-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent), #0055d4);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }
    
    .demo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 122, 255, 0.4);
    }
    
    .demo-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .demo-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    
    /* Dock 演示 */
    .demo-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    
    .demo-dock-item {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 12px;
    }
    
    .demo-dock-item:hover {
      transform: scale(1.4) translateY(-10px);
      margin: 0 12px;
    }
    
    .demo-dock-icon {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, var(--accent), #bf5af2);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }
    
    .demo-dock-item.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    }
    
    .demo-dock-tooltip {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    
    .demo-dock-item:hover .demo-dock-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      🦐 晨翼Agent UI 组件演示
    </div>
    
    <div class="demo-content">
      <div class="demo-card">
        <div class="demo-title">✨ UI 优化完成</div>
        <div class="demo-subtitle">已成功实现 macOS 风格的 Dock、毛玻璃效果和多窗口管理</div>
        
        <div class="feature-grid">
          <div class="feature-item" onclick="showFeature('dock')">
            <div class="feature-icon">🎯</div>
            <div class="feature-name">Dock 动效</div>
            <div class="feature-desc">悬停放大、拖拽排序、活跃指示</div>
          </div>
          
          <div class="feature-item" onclick="showFeature('glass')">
            <div class="feature-icon">🪟</div>
            <div class="feature-name">毛玻璃效果</div>
            <div class="feature-desc">backdrop-filter、圆角边框</div>
          </div>
          
          <div class="feature-item" onclick="showFeature('window')">
            <div class="feature-icon">🪟</div>
            <div class="feature-name">窗口管理</div>
            <div class="feature-desc">拖拽、缩放、最大化、最小化</div>
          </div>
          
          <div class="feature-item" onclick="showFeature('animation')">
            <div class="feature-icon">✨</div>
            <div class="feature-name">流畅动画</div>
            <div class="feature-desc">平滑过渡、响应式交互</div>
          </div>
        </div>
        
        <div class="demo-buttons">
          <button class="demo-btn" onclick="createDemoWindow()">创建演示窗口</button>
          <button class="demo-btn secondary" onclick="toggleGlassEffect()">切换毛玻璃</button>
          <button class="demo-btn secondary" onclick="showNotification('演示通知', 'success')">显示通知</button>
        </div>
      </div>
    </div>
    
    <!-- 演示 Dock -->
    <div class="demo-dock" id="demo-dock">
      <div class="demo-dock-item active">
        <div class="demo-dock-icon" style="background: linear-gradient(135deg, #5ac8fa, #007aff);">📁</div>
        <span class="demo-dock-tooltip">文件</span>
      </div>
      <div class="demo-dock-item">
        <div class="demo-dock-icon" style="background: linear-gradient(135deg, #007aff, #bf5af2);">💬</div>
        <span class="demo-dock-tooltip">对话</span>
      </div>
      <div class="demo-dock-item">
        <div class="demo-dock-icon" style="background: linear-gradient(135deg, #ff9f0a, #ffd60a);">🔧</div>
        <span class="demo-dock-tooltip">工具</span>
      </div>
      <div class="demo-dock-item">
        <div class="demo-dock-icon" style="background: linear-gradient(135deg, #30d158, #64d2ff);">📱</div>
        <span class="demo-dock-tooltip">设备</span>
      </div>
      <div class="demo-dock-item">
        <div class="demo-dock-icon" style="background: linear-gradient(135deg, #64748b, #94a3b8);">⚙️</div>
        <span class="demo-dock-tooltip">设置</span>
      </div>
    </div>
  </div>
  
  <script>
    // Dock 悬停效果
    const dockItems = document.querySelectorAll('.demo-dock-item');
    dockItems.forEach((item, index) => {
      item.addEventListener('mouseenter', () => {
        dockItems.forEach((otherItem, otherIndex) => {
          const distance = Math.abs(index - otherIndex);
          if (distance === 1) {
            otherItem.style.transform = 'scale(1.15) translateY(-4px)';
          } else if (distance === 2) {
            otherItem.style.transform = 'scale(1.05) translateY(-2px)';
          }
        });
      });
      
      item.addEventListener('mouseleave', () => {
        dockItems.forEach(otherItem => {
          otherItem.style.transform = '';
        });
      });
      
      item.addEventListener('click', () => {
        dockItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        showNotification(`已切换到 ${item.querySelector('.demo-dock-tooltip').textContent}`, 'info');
      });
    });
    
    // 功能演示
    function showFeature(feature) {
      const messages = {
        dock: 'Dock 动效：悬停放大、拖拽排序、活跃指示点',
        glass: '毛玻璃效果：backdrop-filter: blur(20px)、圆角边框',
        window: '窗口管理：拖拽移动、8方向缩放、最大化/最小化',
        animation: '流畅动画：所有交互都有平滑的过渡效果'
      };
      
      showNotification(messages[feature], 'info');
    }
    
    // 创建演示窗口
    let windowCount = 0;
    function createDemoWindow() {
      windowCount++;
      const windowId = `demo-window-${windowCount}`;
      
      // 创建窗口元素
      const windowEl = document.createElement('div');
      windowEl.id = windowId;
      windowEl.className = 'macos-window glass-window';
      windowEl.style.cssText = `
        position: fixed;
        width: 600px;
        height: 400px;
        top: ${100 + windowCount * 30}px;
        left: ${100 + windowCount * 30}px;
        z-index: ${100 + windowCount};
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(30, 30, 32, 0.92);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        animation: windowOpen 0.4s ease;
      `;
      
      windowEl.innerHTML = `
        <div class="window-titlebar" style="
          height: 52px;
          background: linear-gradient(180deg, rgba(45, 45, 48, 0.95), rgba(35, 35, 38, 0.9));
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
          display: flex;
          align-items: center;
          padding: 0 16px;
          gap: 12px;
          cursor: move;
          user-select: none;
        ">
          <div class="window-controls" style="display: flex; gap: 8px;">
            <div class="window-btn close" onclick="closeDemoWindow('${windowId}')" style="
              width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; cursor: pointer;
            "></div>
            <div class="window-btn minimize" onclick="minimizeDemoWindow('${windowId}')" style="
              width: 12px; height: 12px; border-radius: 50%; background: #febc2e; cursor: pointer;
            "></div>
            <div class="window-btn maximize" onclick="maximizeDemoWindow('${windowId}')" style="
              width: 12px; height: 12px; border-radius: 50%; background: #28c840; cursor: pointer;
            "></div>
          </div>
          <div class="window-title" style="flex: 1; display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 20px;">🪟</span>
            <span style="font-size: 15px; font-weight: 600;">演示窗口 #${windowCount}</span>
          </div>
        </div>
        <div class="window-content" style="
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          color: var(--text-secondary);
        ">
          <div style="text-align: center;">
            <div style="font-size: 48px; margin-bottom: 20px;">✨</div>
            <div style="font-size: 18px; font-weight: 600; margin-bottom: 10px;">窗口管理演示</div>
            <div style="font-size: 14px;">拖拽标题栏移动窗口</div>
            <div style="font-size: 14px;">点击按钮最小化/最大化/关闭</div>
          </div>
        </div>
      `;
      
      document.body.appendChild(windowEl);
      
      // 添加拖拽功能
      makeDraggable(windowEl);
      
      showNotification(`已创建演示窗口 #${windowCount}`, 'success');
    }
    
    // 拖拽功能
    function makeDraggable(element) {
      const titlebar = element.querySelector('.window-titlebar');
      if (!titlebar) return;
      
      let isDragging = false;
      let startX, startY, startLeft, startTop;
      
      titlebar.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('window-btn')) return;
        
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = element.offsetLeft;
        startTop = element.offsetTop;
        
        element.style.zIndex = 1000;
      });
      
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        
        element.style.left = (startLeft + deltaX) + 'px';
        element.style.top = (startTop + deltaY) + 'px';
      });
      
      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }
    
    // 关闭窗口
    function closeDemoWindow(windowId) {
      const windowEl = document.getElementById(windowId);
      if (windowEl) {
        windowEl.style.animation = 'windowClose 0.3s ease forwards';
        setTimeout(() => windowEl.remove(), 300);
      }
    }
    
    // 最小化窗口
    function minimizeDemoWindow(windowId) {
      const windowEl = document.getElementById(windowId);
      if (windowEl) {
        windowEl.classList.toggle('minimized');
        if (windowEl.classList.contains('minimized')) {
          windowEl.style.transform = 'scale(0.1)';
          windowEl.style.opacity = '0';
          windowEl.style.pointerEvents = 'none';
        } else {
          windowEl.style.transform = '';
          windowEl.style.opacity = '';
          windowEl.style.pointerEvents = '';
        }
      }
    }
    
    // 最大化窗口
    function maximizeDemoWindow(windowId) {
      const windowEl = document.getElementById(windowId);
      if (windowEl) {
        windowEl.classList.toggle('maximized');
        if (windowEl.classList.contains('maximized')) {
          windowEl.style.width = '100%';
          windowEl.style.height = 'calc(100% - 140px)';
          windowEl.style.top = '60px';
          windowEl.style.left = '0';
          windowEl.style.borderRadius = '0';
        } else {
          windowEl.style.width = '600px';
          windowEl.style.height = '400px';
          windowEl.style.top = '100px';
          windowEl.style.left = '100px';
          windowEl.style.borderRadius = '12px';
        }
      }
    }
    
    // 切换毛玻璃效果
    let glassEnabled = true;
    function toggleGlassEffect() {
      glassEnabled = !glassEnabled;
      
      document.querySelectorAll('.glass-window, .glass-dock, .glass-menubar').forEach(el => {
        if (glassEnabled) {
          el.style.backdropFilter = 'blur(40px)';
          el.style.webkitBackdropFilter = 'blur(40px)';
        } else {
          el.style.backdropFilter = 'none';
          el.style.webkitBackdropFilter = 'none';
        }
      });
      
      showNotification(glassEnabled ? '毛玻璃效果已启用' : '毛玻璃效果已禁用', 'info');
    }
    
    // 显示通知
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.style.cssText = `
        position: fixed;
        top: 80px;
        right: 20px;
        padding: 14px 20px;
        border-radius: 12px;
        font-size: 14px;
        z-index: 10000;
        max-width: 360px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        animation: notifIn 0.3s ease-out;
        ${type === 'success' ? 'background: rgba(48, 209, 88, 0.9); color: white;' : ''}
        ${type === 'error' ? 'background: rgba(255, 55, 95, 0.9); color: white;' : ''}
        ${type === 'info' ? 'background: rgba(0, 122, 255, 0.9); color: white;' : ''}
      `;
      
      const icons = { success: '✓', error: '✕', info: 'ℹ' };
      notification.innerHTML = `
        <span>${icons[type] || icons.info}</span>
        <span>${message}</span>
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'notifIn 0.3s ease reverse';
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    }
    
    // 添加动画样式
    const style = document.createElement('style');
    style.textContent = `
      @keyframes windowOpen {
        from { opacity: 0; transform: scale(0.9) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      
      @keyframes windowClose {
        from { opacity: 1; transform: scale(1) translateY(0); }
        to { opacity: 0; transform: scale(0.9) translateY(20px); }
      }
      
      @keyframes notifIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
